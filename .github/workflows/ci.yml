name: CI

"on":
  push:
    branches: [main]
  pull_request:
  # No schedule. Images are built on push: the base image is pinned by
  # digest, so a scheduled rebuild would only move the version tag's digest
  # and restart every consumer for nothing. Base image bumps (new tag, or the
  # same tag republished) arrive as Renovate PRs.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write
  security-events: write

jobs:
  # The image version is the upstream The Lounge version in the Dockerfile's
  # FROM line, not a git tag. Every main build re-pushes that tag, so a rebuild
  # (a patch change, or upstream republishing the same version) moves its
  # digest and consumers pinning tag@digest get a digest update.
  version:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.from.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: from
        run: |
          tag=$(sed -n 's#^FROM .*thelounge/thelounge:\([^@]*\)@.*#\1#p' Dockerfile)
          [[ $tag =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::no version in the FROM line: '$tag'"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  docker:
    needs: version
    uses: mbologna/.github/.github/workflows/docker-ci.yml@65000f3803251d78b7353ca06f44b9745d8260fc # main
    with:
      image_name: thelounge-patched
      # push: there are no releases; each main build re-pushes the
      # version tag above.
      publish: push
      extra_tags: type=raw,value=${{ needs.version.outputs.tag }},enable={{is_default_branch}}
      push_to_dockerhub: false
    secrets: inherit

name: CI

"on":
  push:
    branches: [main]
    # auto-release's tags start their build by workflow_dispatch; a tag
    # pushed by hand (the first one) starts it here.
    tags: ["v*"]
  pull_request:
  # Monday's release run: auto-release tags vX.Y.Z+up<upstream> when a
  # releasable commit or an upstream bump landed. It builds nothing itself.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a run on the default branch: it may be releasing, and a cut
  # release leaves a tag without its Release.
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

permissions:
  contents: read

jobs:
  # Releases follow mbologna/.github's VERSIONING.md: this repository's own
  # SemVer with the upstream The Lounge version from the Dockerfile's FROM
  # line as build metadata, v1.0.0+up4.5.2. Its build pushes 1.0.0, 1.0 and
  # latest (image tags can't carry the +). Pull requests build without
  # pushing.
  docker:
    # Build, push, sign and scan the image; the auto-release job below releases.
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
    uses: mbologna/.github/.github/workflows/docker-ci.yml@d17b76ff2f8404153bf1fa08e875e6972b046c09 # main
    with:
      image_name: thelounge-patched
      publish: release
    secrets: inherit

  # Monday's schedule tags vX.Y.Z when a feat, fix, perf, revert or breaking commit
  # landed (or a maintenance release for dependency updates), a push to main tags
  # only a CVE fix; it dispatches the tag build that publishes the X.Y.Z image.
  auto-release:
    needs: [docker]
    # contents: push the tag and create the Release; actions: dispatch the tag
    # build (a tag pushed with GITHUB_TOKEN triggers no run).
    permissions:
      contents: write
      actions: write
    uses: mbologna/.github/.github/workflows/auto-release.yml@d17b76ff2f8404153bf1fa08e875e6972b046c09 # main
    with:
      strategy: conventional
      image: ghcr.io/mbologna/thelounge-patched
      dockerfiles: Dockerfile
      metadata_command: printf 'up%s' "$(sed -n 's#^FROM .*thelounge/thelounge:\([^@]*\)@.*#\1#p' Dockerfile)"

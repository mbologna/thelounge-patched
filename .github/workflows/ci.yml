name: CI

"on":
  push:
    branches: [main]
    # auto-release's tags start their build by workflow_dispatch; a tag
    # pushed by hand (the first one) starts it here.
    tags: ["v*"]
  pull_request:
  # Monday's release run: auto-release tags v<upstream>+r<N> when a
  # releasable commit or an upstream bump landed. It builds nothing itself.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a run on the default branch: it may be releasing, and a cut
  # release leaves a tag without its Release.
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

permissions:
  contents: read

jobs:
  # Releases follow pattern B of mbologna/.github's VERSIONING.md: the tag is
  # the upstream The Lounge version from the Dockerfile's FROM line plus this
  # repository's release number on it, v4.5.2+r1. Its build pushes 4.5.2-r1,
  # which never moves, and 4.5.2, 4.5 and latest, which follow the newest
  # release. Pull requests build without pushing.
  docker:
    # contents: the release tag and its Release; actions: dispatch the tag
    # build (a tag pushed with GITHUB_TOKEN triggers no run); the rest:
    # push, sign and scan the image.
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      security-events: write
      actions: write
    uses: mbologna/.github/.github/workflows/docker-ci.yml@423fe81596d69d9cd74191195ee6d3af7f9bf360 # main
    with:
      image_name: thelounge-patched
      publish: release
      push_to_dockerhub: false
      # auto-release runs inside docker-ci: Monday's schedule releases with
      # this strategy, a push to main only a CVE fix.
      release_strategy: conventional
      release_upstream_command: sed -n 's#^FROM .*thelounge/thelounge:\([^@]*\)@.*#\1#p' Dockerfile
    secrets: inherit
